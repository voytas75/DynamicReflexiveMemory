name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --all-extras --frozen

      - name: Run pytest
        run: uv run --all-extras --frozen pytest --cov --cov-report=term-missing --cov-fail-under=85 --disable-warnings -q

      - name: Run mypy
        run: uv run --all-extras --frozen mypy .

      - name: Run ruff
        run: uv run --all-extras --frozen ruff check .

      - name: Check formatting
        run: uv run --all-extras --frozen black --check .
