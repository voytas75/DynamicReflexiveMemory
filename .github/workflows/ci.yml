name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85 --disable-warnings -q

      - name: Run mypy
        run: mypy .

      - name: Run ruff
        run: ruff check .

      - name: Check formatting
        run: black --check .
