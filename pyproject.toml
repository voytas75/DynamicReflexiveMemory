[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-reflexive-memory"
version = "0.1.0"
description = "Dynamic Reflexive Memory core application"
requires-python = ">=3.12"
dependencies = [
    "chromadb==0.5.3",
    "litellm==1.84.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "PySide6==6.8.2",
    "redis==5.1.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.142.3",
    "pyright==1.1.411",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.14.1",
    "pytest-xdist==3.6.1",
    "ruff==0.14.2",
    "vcrpy==8.2.1",
]

[tool.setuptools.packages.find]
include = ["config*", "core*", "gui*", "models*"]

[tool.ruff]
line-length = 88

[tool.coverage.run]
source = ["config", "core", "models"]
omit = [
    "gui/*",
    "scripts/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["config", "core", "main.py", "models"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that exercise external services",
]
